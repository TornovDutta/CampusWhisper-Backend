version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: whisper-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-whisper}
      POSTGRES_USER: ${DB_USER:-whisper_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whisper_password}
    volumes:
      - whisper-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - whisper-network

  cache:
    image: redis:7-alpine
    container_name: whisper-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - whisper-redis-data:/data
    restart: unless-stopped
    networks:
      - whisper-network

  app:
    build: .
    container_name: campus-whisper
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-whisper}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-whisper_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whisper_password}
      SPRING_REDIS_HOST: cache
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      - database
      - cache
    restart: unless-stopped
    networks:
      - whisper-network

volumes:
  whisper-pg-data:
  whisper-redis-data:

networks:
  whisper-network:
    driver: bridge