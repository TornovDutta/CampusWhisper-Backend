services:
  - type: web
    name: campuswhisper-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: HIBERNATE_DDL_AUTO
        value: update
